name: Bug report
description: Something in the extension is broken (popup, settings, a site misbehaving because of it)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.8.3
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on macOS 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console errors, screenshots, or whether turning off fingerprint randomization helps.
