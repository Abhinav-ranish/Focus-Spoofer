<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Spoofer Settings</title>
    <style>
        :root {
            --accent: #ef4444;
            --accent-green: #22c55e;
            --accent-glow: rgba(239, 68, 68, 0.3);
            --green-glow: rgba(34, 197, 94, 0.25);
            --bg: #0f0f11;
            --card: #18181b;
            --card-border: rgba(255, 255, 255, 0.06);
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --text-muted: #52525b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .page-header img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 28px;
        }

        h2 {
            font-size: 15px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .card-description {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
            background: rgba(34, 197, 94, 0.04);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-green));
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
            transition: opacity 0.2s, box-shadow 0.2s;
        }

        button:hover {
            opacity: 0.9;
            box-shadow: 0 2px 16px var(--accent-glow);
        }

        .domain-list-header {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 10px;
            transition: background-color 0.15s;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        li + li {
            margin-top: 2px;
        }

        .domain-name {
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            color: var(--text);
        }

        .remove-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 6px;
            transition: color 0.2s, background-color 0.2s;
        }

        .remove-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
            box-shadow: none;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 32px 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="page-header">
        <img src="icons/icon48.png" alt="Focus Spoofer">
        <h1>Settings</h1>
    </div>

    <div class="card">
        <h2>Always-On Domains</h2>
        <p class="card-description">Focus spoofing activates automatically for these domains when they load.</p>

        <div class="input-group">
            <input type="text" id="domainInput" placeholder="example.com">
            <button id="addBtn">Add</button>
        </div>

        <div class="domain-list-header" id="listHeader" style="display:none;">Domains</div>
        <ul id="domainList"></ul>
        <div id="emptyState" class="empty-state" style="display:none;">
            No domains added yet.
        </div>
    </div>

    <script src="options.js"></script>
</body>

</html>
