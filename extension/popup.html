<body>
  <div class="container">
    <header class="header">

          <path class="sclera" d="M36 200C104 98 296 98 364 200C296 302 104 302 36 200Z"/>
          <g clip-path="url(#popLogoClip)">

      <div class="header-text">
        <h1>Focus Spoofer</h1>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </a>
    </header>

    <main class="main-content">
      <section class="status-row">
        <div class="icon-container" id="iconContainer">
          <svg class="icon-img" viewBox="28 28 344 344" aria-hidden="true" id="mainIcon">
          <defs><clipPath id="popEyeClip"><path d="M36 200C104 98 296 98 364 200C296 302 104 302 36 200Z"/></clipPath></defs>
          <path class="sclera" d="M36 200C104 98 296 98 364 200C296 302 104 302 36 200Z"/>
          <g clip-path="url(#popEyeClip)">
            <path class="iris" d="M275 200Q275 207 274 213Q273 220 271 226Q268 232 264 237Q260 242 256 247Q250 250 245 253Q239 256 233 258Q228 260 222 261Q217 262 211 263Q206 265 200 266Q194 266 188 267Q182 267 176 266Q170 265 164 263Q158 260 153 256Q149 251 145 246Q143 240 141 234Q139 228 138 223Q137 217 136 211Q135 206 134 200Q133 194 132 188Q132 182 131 175Q132 168 133 161Q135 155 139 149Q143 143 149 139Q155 136 162 134Q169 133 175 133Q182 133 188 134Q194 136 200 137Q205 139 211 140Q216 141 221 143Q226 144 232 145Q237 147 243 149Q248 152 253 156Q258 160 262 164Q266 169 269 175Q271 181 273 187Q274 193 275 200Z"/>
            <circle class="pupil" cx="200" cy="200" r="30"/>
            <circle class="glint" cx="180" cy="180" r="10"/>
          </g>
          <path class="lash" d="M36 200C104 98 296 98 364 200C296 302 104 302 36 200Z" stroke-width="18"/>
        </svg>
        </div>
        <div class="status-block">
          <div class="status-text" id="statusText">Inactive</div>
          <div class="site-name" id="siteName"></div>
        </div>
        <div class="toggle-container">
          <label class="switch" title="Protect this tab">
            <input type="checkbox" id="toggleSwitch" aria-label="Protect this tab">
            <span class="slider round"></span>
          </label>
        </div>
      </section>

      <div class="divider"></div>

      <div class="options-container">
        <label class="checkbox-label">
          <input type="checkbox" id="alwaysOnCheckbox">
          <span>Always protect this site</span>
        </label>
      </div>

      <p class="description">
        Hides tab switches and minimizing from this tab. Changes reload the page.
      </p>
    </main>
  </div>
  <script src="popup.js"></script>
</body>

</html>
